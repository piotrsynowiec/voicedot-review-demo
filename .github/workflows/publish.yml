name: Publish review website

on:
  push:
    branches: [review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate publication boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Assemble static files and exact commit manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/build_site.py --commit "$SOURCE_COMMIT" --branch review
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
